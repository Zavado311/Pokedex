<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dein Pokedex || Gotta Catch 'Em All</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/Pokeball.webp" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style/focusPokemon.css" />
    <script src="script.js"></script>
    <script src="scripts/template.js"></script>
  </head>
  <body onload="init()">
    <header class="sectionDesignHeader">
      <div class="overallMenu">
        <a href="index.html" class="logoWithName">
          <div class="overPokeImg">
            <img class="pokeImg" src="assets/img/Pokeball.webp" alt="" />
          </div>
          <div class="logo">
            <img src="assets/img/logoPokemon.jpg" alt="" />
          </div>
        </a>
        <input
          type="search"
          placeholder="Nach Pokemon oder ID suchen"
          minlength="3"
          oninput="filterPokemon()"
          class="searchbar"
          id="searchBar"
        />
      </div>
    </header>
    <main class="sectionDesign">
      <div id="showCurrentPokemon" class="backGround d-none">
        <div class="showPokemon" id="focusPokemon"></div>
      </div>
      <div class="contentOverall" id="contentOverall">
        <div class="contentDesign" id="content"></div>
      </div>
      <div class="showMeMore">
        <button class="showButton" id="showButton" onclick="showMeMore()">
          Zeig mir mehr!
        </button>
      </div>
    </main>
    <footer class="sectionDesignFooter">
      <div class="overallMenuFooter">
        <div class="impressumTitle">Impressum</div>
        <div class="impressum">
          Brian Wigger<br />Musterstrasse 19<br />60255 Musterdorf
        </div>
      </div>
    </footer>
  </body>
</html>
